_target_: src.data.example_datamodule.ExampleDataModule
dataset_class:
  _partial_: true
  _target_: src.data.components.audio_file_dataset.AudioFileDataset
  data_dir: ${paths.data_dir}/VoiceEnhancer
  supported_file_extensions: ["wav", "flac"]
  audio_duration: 2
  sample_rate: 44100
  num_channels: 2
batch_size: null  # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
train_val_test_split: [0.9, 0.05, 0.05]
num_workers: 16
pin_memory: True
seed: ${seed}