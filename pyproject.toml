[project]
name = "mert-vocoder"
version = "0.1.0"
description = "Research repository for a neural vocoder trained on MERT representations."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "mlflow>=3.10.1",
    "omegaconf>=2.3.0",
    "rich>=14.3.3",
    "rootutils>=1.0.7",
    "soundfile>=0.13.1",
    "soxr>=1.0.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchmetrics>=1.8.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # naming conventions
    "N",
]

[tool.ty.environment]
root = ["./src"]
python = ".venv"